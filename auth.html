<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AffiliatePro • Acceso</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="firebase-init.js"></script>
</head>
<body>
  <main class="auth-container">
    <h1>Bienvenido a AffiliatePro</h1>

    <div class="tab-selector">
      <button id="loginTab" class="active">Iniciar Sesión</button>
      <button id="registerTab">Registrarse</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form">
      <label>Email</label>
      <input type="email" id="loginEmail" required />
      <label>Contraseña</label>
      <input type="password" id="loginPassword" required />
      <button class="btn-primary" type="submit">Ingresar</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="auth-form" style="display:none;">
      <label>Email</label>
      <input type="email" id="registerEmail" required />
      <label>Contraseña</label>
      <input type="password" id="registerPassword" required />
      <button class="btn-primary" type="submit">Crear Cuenta</button>
    </form>
  </main>

  <script type="module">
    import { auth } from './firebase-init.js';
    import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js';

    // Tab switching
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    loginTab.addEventListener('click', () => {
      loginTab.classList.add('active');
      registerTab.classList.remove('active');
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
    });

    registerTab.addEventListener('click', () => {
      registerTab.classList.add('active');
      loginTab.classList.remove('active');
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
    });

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert(err.message);
      }
    });

    // Register
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
